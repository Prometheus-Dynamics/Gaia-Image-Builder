[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.6-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Gaia-Image-Builder"
homepage = "https://github.com/Prometheus-Dynamics/Gaia-Image-Builder"

[workspace.dependencies]
# Daedalus `next`, locked by commit. Moving the lock is its own PR.
daedalus = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "9d8ed1369e4e236f343668bcf718713476fd7def", features = ["std", "threads"] }
daedalus-backend-process = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "9d8ed1369e4e236f343668bcf718713476fd7def" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
