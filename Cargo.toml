[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.6-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Gaia-Image-Builder"
homepage = "https://github.com/Prometheus-Dynamics/Gaia-Image-Builder"

[workspace.dependencies]
# Daedalus `next`, locked by commit. Moving the lock is its own PR.
daedalus = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9", features = ["std", "threads"] }
daedalus-backend-process = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.dev]
# Line tables keep file:line in backtraces and panics; full debug info more
# than doubled the target dir (6.9 GB against 3.0 GB) with no build or test time to show for it.
debug = "line-tables-only"

# The xz library is C that lzma-sys builds; unoptimized, the flash step's
# tests spent minutes in it. Its bytes do not depend on the optimization.
[profile.dev.package.lzma-sys]
opt-level = 3

# The store hashes every file it takes in (sha256). Unoptimized, putting a
# Rust toolchain (744 MB) into a test's store took 52 s against 1.8 s for the
# cargo build that used it. The digests do not depend on the optimization.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
