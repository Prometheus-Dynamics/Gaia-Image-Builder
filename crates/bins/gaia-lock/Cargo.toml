[package]
name = "gaia-lock-cmd"
description = "gaia lock: resolves every source a product names and writes its lock"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "gaia_lock_cmd"
path = "src/lib.rs"

[[bin]]
name = "gaia-lock"
path = "src/main.rs"

[dependencies]
gaia-describe = { path = "../../core/describe" }
gaia-lock = { path = "../../core/lock" }
gaia-source-oci = { path = "../../nodes/source-oci" }
gaia-store = { path = "../../core/store" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
