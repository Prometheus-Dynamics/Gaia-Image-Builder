[package]
name = "gaia-progress"
description = "Build progress for the gaia command: running steps, done of total, and the failing step's stderr"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# No unit tests: its cases are in tests/. Building an empty unit-test
# binary on every change costs the gate a link (gaia tests/all/lib_tests.rs).
test = false

[dependencies]
gaia-step = { path = "../../core/step" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
