[package]
name = "gaia-verdict"
description = "A heavy test's pass, kept under the hash of everything it reads, so an unchanged case is not run again locally"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# No unit tests: its cases are in tests/. Building an empty unit-test
# binary on every change costs the gate a link (gaia tests/all/lib_tests.rs).
test = false

[dependencies]
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
