[package]
name = "gaia-recipe"
description = "Recipes as data: a named, parameterized Daedalus node group read from a file"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
toml = "0.9"

[dev-dependencies]
daedalus-cpu-author = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-types = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
