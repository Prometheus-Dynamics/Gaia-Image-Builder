[package]
name = "gaia-formats"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "On-media formats Gaia writes and Atlas reads: UBI images and dm-verity superblocks."

[lib]
name = "gaia_formats"

# The default build is the format types and their encode/decode, on `std`
# alone. The rest is opt-in, so a device that reads these formats builds
# nothing else.
[features]
default = []
# encode_peb, encode_volume_table: laying out a UBI image (Gaia's writer).
builder = []
# read_image, find_peb_size, programmed_len: reading a UBI image from a Read + Seek.
io = []
# verity::Derived, verity::derived_uuid: Gaia's default salt and UUID (sha2).
derive = ["dep:sha2"]

[dependencies]
sha2 = { workspace = true, optional = true }

[[test]]
name = "ubi"
required-features = ["builder", "io"]

[[test]]
name = "verity"
required-features = ["derive"]

[lints]
workspace = true
