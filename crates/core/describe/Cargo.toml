[package]
name = "gaia-describe"
description = "Board, component and product files: read, checked, with errors that name the file and key"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# No unit tests: its cases are in tests/. Building an empty unit-test
# binary on every change costs the gate a link (gaia tests/all/lib_tests.rs).
test = false

[dependencies]
gaia-lock = { path = "../lock" }
gaia-types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
