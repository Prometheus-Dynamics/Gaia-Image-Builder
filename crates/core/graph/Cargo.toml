[package]
name = "gaia-graph"
description = "Descriptions, the lock and recipes into one Daedalus graph document, checked by the planner"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus = { workspace = true }
daedalus-cpu = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
gaia-describe = { path = "../describe" }
gaia-lock = { path = "../lock" }
gaia-recipe = { path = "../recipe" }
gaia-types = { path = "../types" }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
gaia-build-rust = { path = "../../nodes/build-rust" }
gaia-source-files = { path = "../../nodes/source-files" }
gaia-compress = { path = "../../nodes/compress" }
gaia-source-git = { path = "../../nodes/source-git" }
gaia-source-oci = { path = "../../nodes/source-oci" }
tempfile = "3"

[lints]
workspace = true
