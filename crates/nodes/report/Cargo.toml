[package]
name = "gaia-report"
description = "Nodes: the report of one image: sources built from, sizes, every file with its owning component, and the delta against a previous report, with secrets masked"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus = { workspace = true }
daedalus-cpu-author = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-types = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
gaia-lock = { path = "../../core/lock" }
gaia-step = { path = "../../core/step" }
gaia-store = { path = "../../core/store" }
gaia-types = { path = "../../core/types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gaia-tree = { path = "../tree" }
gaia-build-rust = { path = "../build-rust" }
gaia-compress = { path = "../compress" }
gaia-source-files = { path = "../source-files" }
gaia-source-git = { path = "../source-git" }
gaia-source-oci = { path = "../source-oci" }
tempfile = "3"

[lints]
workspace = true
