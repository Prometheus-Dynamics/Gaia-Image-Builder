[package]
name = "gaia-flash-image"
description = "Node: the first-flash .img.xz a board accepts (xz limits checked, optional Ed25519 signature record as a second stream)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
blake2 = "=0.10.6"
daedalus = { workspace = true }
daedalus-cpu-author = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
daedalus-types = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "831aecbe91d7fa8c5d5c65101ffb7e5309154039" }
ed25519-dalek = "=2.2.0"
gaia-step = { path = "../../core/step" }
gaia-store = { path = "../../core/store" }
gaia-types = { path = "../../core/types" }
lzma-sys = { version = "=0.1.20", features = ["static"] }
sha2 = "=0.11.1"
xz2 = "=0.1.7"
zeroize = "1"

[dev-dependencies]
gaia-sign = { path = "../sign" }
tempfile = "3"

[lints]
workspace = true
