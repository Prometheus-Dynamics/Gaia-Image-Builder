[package]
name = "gaia-os-import"
description = "Node: an existing disk image or rootfs archive imported as its root filesystem and boot trees"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus = { workspace = true }
daedalus-cpu-author = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "9d8ed1369e4e236f343668bcf718713476fd7def" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "9d8ed1369e4e236f343668bcf718713476fd7def" }
daedalus-types = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "9d8ed1369e4e236f343668bcf718713476fd7def" }
ext4-view = { version = "1", features = ["std"] }
fatfs = "0.3"
flate2 = "1"
gaia-step = { path = "../../core/step" }
gaia-store = { path = "../../core/store" }
gaia-types = { path = "../../core/types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"

[dev-dependencies]
flate2 = "1"
fatfs = "0.3"
serde_json = "1"
tar = "0.4"
tempfile = "3"

[lints]
workspace = true
