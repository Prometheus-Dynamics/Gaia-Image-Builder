[package]
name = "gaia-os-import"
description = "Node: an existing disk image or rootfs archive imported as its root filesystem and boot trees"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
daedalus = { workspace = true }
daedalus-cpu-author = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }
daedalus-types = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }
ext4-view = { version = "=1.0.0", features = ["std"] }
fatfs = "=0.3.6"
flate2 = "=1.1.11"
gaia-step = { path = "../../core/step" }
gaia-store = { path = "../../core/store" }
gaia-types = { path = "../../core/types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lzma-sys = { version = "=0.1.20", features = ["static"] }
miniz_oxide = "=0.9.1"
tar = "=0.4.46"
xz2 = "=0.1.7"
zstd = "0.13"

[dev-dependencies]
flate2 = "=1.1.11"
fatfs = "=0.3.6"
serde_json = "1"
tar = "=0.4.46"
tempfile = "3"

[lints]
workspace = true
