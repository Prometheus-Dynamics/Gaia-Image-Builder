[package]
name = "gaia-source-files"
description = "Nodes: a local path as a tree, an archive unpacked to a tree, a download checked against its locked digest"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# No unit tests: its cases are in tests/. Building an empty unit-test
# binary on every change costs the gate a link (gaia tests/all/lib_tests.rs).
test = false

[dependencies]
daedalus = { workspace = true }
daedalus-cpu-author = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }
daedalus-registry = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }
daedalus-types = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "b3916178f255ab9f55d230dff1395c08b3bca2c9" }
flate2 = "=1.1.11"
serde_json = "1"
gaia-step = { path = "../../core/step" }
gaia-store = { path = "../../core/store" }
gaia-types = { path = "../../core/types" }
lzma-sys = { version = "=0.1.20", features = ["static"] }
miniz_oxide = "=0.9.1"
tar = "=0.4.46"
xz2 = "=0.1.7"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
