name: Next

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain and its components.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sandbox tests need bubblewrap and unprivileged user namespaces,
      # and the filesystem, initramfs, strip and verity tests their tools; all
      # must run here rather than skip.
      - run: |
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q bubblewrap e2fsprogs erofs-utils mtools dosfstools cpio qemu-user-static cryptsetup-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: ./scripts/gate.sh
        env:
          GAIA_REQUIRE_SANDBOX: "1"
          GAIA_REQUIRE_TOOLS: "1"
