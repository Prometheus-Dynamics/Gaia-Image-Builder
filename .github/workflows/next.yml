name: Next

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain is rust-toolchain.toml's pin, with its components, as
      # the default, and the only one installed. rust-cache's key hashes
      # every installed rustc: `dtolnay/rust-toolchain@stable` installed the
      # current stable, which no build used (the pin overrides it in the
      # checkout), and the runner image keeps one too, so each stable point
      # release or image update moved the key and left a cold cache
      # (run 46106615692 listed 1.100.1 beside 1.99.0).
      - name: Rust toolchain (the pin in rust-toolchain.toml)
        run: |
          read -r pin components targets < <(python3 -c '
          import tomllib
          t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]
          print(t["channel"], ",".join(t.get("components", [])) or "-", ",".join(t.get("targets", [])) or "-")')
          args=(--profile minimal --no-self-update)
          [ "$components" = - ] || args+=(--component "$components")
          [ "$targets" = - ] || args+=(--target "$targets")
          rustup toolchain install "$pin" "${args[@]}"
          rustup default "$pin"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in "$pin"-*) ;; *) rustup toolchain uninstall "$tc" ;; esac
          done
      # The active rustc is the pin, in the checkout and outside it (the
      # default), and no other toolchain is installed, or the job stops.
      - name: The active rustc is the pin
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          default=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustc -vV
          rustup toolchain list
          [ "$here" = "$pin" ] && [ "$default" = "$pin" ] || {
            echo "::error::active rustc $here (default $default), rust-toolchain.toml pins $pin"; exit 1; }
          others=$(rustup toolchain list | awk '{print $1}' | grep -v "^$pin-" || true)
          [ -z "$others" ] || { echo "::error::toolchains beside the pin $pin: $others"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      # The build-rust tests' pinned Rust release, laid out as a sysroot
      # under target/tmp: rust-cache keeps that directory's tree but none of
      # its files, so it is kept here instead, keyed on what makes it: the
      # pins in the test and toolchain.rs, which lays the release out. The
      # tests use it only with its made mark and while it matches the
      # listing written with it, else make it again. (This step comes after
      # rust-cache, so it saves before rust-cache strips target.) The seed
      # store of their pulled image is not kept: actions/cache restores as
      # an ordinary user, which drops the image's sticky and setgid bits,
      # and the store's tree digest covers them (Next went red on it,
      # 8179090e).
      - id: pins
        run: echo "pins=$(grep -oE '[0-9a-f]{64}|const RELEASE[^;]*' crates/nodes/build-rust/tests/build_rust.rs | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            target/tmp/rust-*/sysroot
            target/tmp/rust-*/sysroot.list
            target/tmp/rust-*/sysroot.made
          key: build-rust-sysroot-listed-${{ runner.os }}-${{ steps.pins.outputs.pins }}-${{ hashFiles('crates/nodes/build-rust/src/toolchain.rs') }}
      # The sandbox tests need bubblewrap and unprivileged user namespaces,
      # and the filesystem, initramfs, strip and verity tests their tools; all
      # must run here rather than skip. The runner image also lists
      # Microsoft's package repository, which nothing here installs from;
      # when it refuses (403 Forbidden) apt-get update fails the job, so it
      # is dropped first.
      - run: |
          sudo rm -f $(grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null)
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q bubblewrap e2fsprogs erofs-utils mtools dosfstools cpio qemu-user cryptsetup-bin python3-pip python3-setuptools device-tree-compiler attr
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The builders' tests: musl std for build-rust's cross builds; the
      # system python with setuptools >= 70.1 for build-python.
      - run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          python3 -c "import setuptools, sys; v = tuple(int(x) for x in setuptools.__version__.split('.')[:2]); print('setuptools', setuptools.__version__); sys.exit(0 if v >= (70, 1) else 1)"
          java -version && go version && node --version && npm --version
      # The gate runs the tests under cargo-nextest when it is installed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: ./scripts/gate.sh
        env:
          GAIA_REQUIRE_SANDBOX: "1"
          GAIA_REQUIRE_TOOLS: "1"
