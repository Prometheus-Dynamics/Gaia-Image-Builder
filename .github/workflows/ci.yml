# The workspace and docs-and-lints jobs are mirrored locally by scripts/ci.sh
# (also the docker/ci image entrypoint); keep them in sync.
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# A newer push to the same branch or pull request supersedes a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Check duplicate dependencies
        run: cargo tree --workspace --duplicates

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Run slow end-to-end tests
        run: cargo test -p gaia-exec --test exec_default -- --ignored

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check app without default features
        run: cargo check -p gaia-app --no-default-features

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Validate package surface
        run: cargo package --workspace --allow-dirty --no-verify
