name: Examples

# Plans every example product on each push and pull request into next. Plans
# only: no image is built here. A product with no committed gaia.lock cannot
# be planned (`gaia lock` writes it), so it gets a warning instead of a plan.
#
# One job: gaia is built once, in the shipped release profile from the
# committed Cargo.lock, while the recipes' tools install beside it; then
# each product is planned in a step of its own, named after it.

on:
  push:
    branches:
      - next
    paths:
      - "examples/**"
      - "crates/**"
      - "action.yml"
      - ".github/workflows/examples.yml"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A plan runs no tool, but a step's tool input must resolve to a path.
      # The tools install in the background while gaia builds, and the
      # plans wait for them (Wait for the tools). Microsoft's package
      # repository, which the runner image lists and nothing here installs
      # from, is dropped first: when it refuses (403 Forbidden) apt-get
      # update fails.
      - name: Start installing the tools the recipes name
        run: |
          # The status is written however the install ends. The commands
          # are chained with &&: in an if's test bash ignores set -e, and
          # the step's -e must not end the background shell before it
          # writes the status.
          (
            if {
              sudo rm -f $(grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null) &&
                sudo apt-get -o Acquire::Retries=5 update -q &&
                sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends erofs-utils cryptsetup-bin bubblewrap
            } > "$RUNNER_TEMP/apt.log" 2>&1; then
              echo 0 > "$RUNNER_TEMP/apt.status"
            else
              echo $? > "$RUNNER_TEMP/apt.status"
            fi
          ) < /dev/null > /dev/null 2>&1 &
      # The toolchain is rust-toolchain.toml's pin, with its components, as
      # the default, and the only one installed. rust-cache's key hashes
      # every installed rustc: `dtolnay/rust-toolchain@stable` installed the
      # current stable, which no build used (the pin overrides it in the
      # checkout), and the runner image keeps one too, so each stable point
      # release or image update moved the key and left a cold cache
      # (run 46106615692 listed 1.100.1 beside 1.99.0).
      - name: Rust toolchain (the pin in rust-toolchain.toml)
        run: |
          read -r pin components targets < <(python3 -c '
          import tomllib
          t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]
          print(t["channel"], ",".join(t.get("components", [])) or "-", ",".join(t.get("targets", [])) or "-")')
          args=(--profile minimal --no-self-update)
          [ "$components" = - ] || args+=(--component "$components")
          [ "$targets" = - ] || args+=(--target "$targets")
          rustup toolchain install "$pin" "${args[@]}"
          rustup default "$pin"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in "$pin"-*) ;; *) rustup toolchain uninstall "$tc" ;; esac
          done
      # The active rustc is the pin, in the checkout and outside it (the
      # default), and no other toolchain is installed, or the job stops.
      - name: The active rustc is the pin
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          default=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustc -vV
          rustup toolchain list
          [ "$here" = "$pin" ] && [ "$default" = "$pin" ] || {
            echo "::error::active rustc $here (default $default), rust-toolchain.toml pins $pin"; exit 1; }
          others=$(rustup toolchain list | awk '{print $1}' | grep -v "^$pin-" || true)
          [ -z "$others" ] || { echo "::error::toolchains beside the pin $pin: $others"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      # Built as shipped: the release profile, the committed Cargo.lock and
      # scripts/shipped-flags.sh, then checked to hold no path of the cargo
      # home (scripts/shipped-paths-check.sh compares builds from two homes).
      - id: build
        name: Build gaia
        run: |
          CARGO_ENCODED_RUSTFLAGS=$(scripts/shipped-flags.sh)
          export CARGO_ENCODED_RUSTFLAGS
          cargo build --release --locked -p gaia --bin gaia
          home=${CARGO_HOME:-$HOME/.cargo}
          if grep -c -F -- "$home" target/release/gaia; then
            echo "::error::the release gaia holds paths of the cargo home $home"
            exit 1
          fi
      - id: tools
        name: Wait for the tools
        timeout-minutes: 5
        run: |
          while [[ ! -s "$RUNNER_TEMP/apt.status" ]]; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt.status")"
      - name: Plan k230d-ai-cam
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        uses: ./
        with:
          gaia-bin: ${{ github.workspace }}/target/release/gaia
          product: examples/products/k230d-ai-cam/product.toml
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
      - name: Plan k230d-zero
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        uses: ./
        with:
          gaia-bin: ${{ github.workspace }}/target/release/gaia
          product: examples/products/k230d-zero/product.toml
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
      - name: Plan luckfox-aura-bench
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        uses: ./
        with:
          gaia-bin: ${{ github.workspace }}/target/release/gaia
          product: examples/products/luckfox-aura-bench/product.toml
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
      - name: Plan rock-5c-demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        uses: ./
        with:
          gaia-bin: ${{ github.workspace }}/target/release/gaia
          product: examples/products/rock-5c-demo/product.toml
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
      - name: Plan zero-3e-demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        uses: ./
        with:
          gaia-bin: ${{ github.workspace }}/target/release/gaia
          product: examples/products/zero-3e-demo/product.toml
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
      # The products with a gaia.lock must be the ones planned below, each
      # in a step of its own: a product added without its step fails here
      # instead of going unplanned.
      - name: Check the products planned
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found=()
          for product in $(find examples/products -name product.toml | sort); do
            if [[ -f "$(dirname "$product")/gaia.lock" ]]; then
              found+=("$product")
            else
              echo "::warning file=$product::no gaia.lock next to this product; it is not planned until gaia lock writes one"
            fi
          done
          planned="examples/products/k230d-ai-cam/product.toml examples/products/k230d-zero/product.toml examples/products/luckfox-aura-bench/product.toml examples/products/rock-5c-demo/product.toml examples/products/zero-3e-demo/product.toml"
          if [[ "${found[*]}" != "$planned" ]]; then
            echo "::error::the products with a gaia.lock are not the ones this workflow plans (give each a Plan step): found ${found[*]}, planned $planned"
            exit 1
          fi
