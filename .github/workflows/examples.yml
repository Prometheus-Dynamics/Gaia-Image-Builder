name: Examples

# Plans every example product on each push and pull request into next. Plans
# only: no image is built here. A product with no committed gaia.lock cannot
# be planned (`gaia lock` writes it), so it gets a warning instead of a plan.

on:
  push:
    branches:
      - next
    paths:
      - "examples/**"
      - "crates/**"
      - "action.yml"
      - ".github/workflows/examples.yml"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.find.outputs.products }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          set -euo pipefail
          planned=()
          for product in $(find examples/products -name product.toml | sort); do
            if [[ -f "$(dirname "$product")/gaia.lock" ]]; then
              planned+=("$product")
            else
              echo "::warning file=$product::no gaia.lock next to this product; it is not planned until gaia lock writes one"
            fi
          done
          printf '%s\n' "${planned[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))' > products.json
          echo "products=$(cat products.json)" >> "$GITHUB_OUTPUT"

  plan:
    needs: list
    if: needs.list.outputs.products != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.list.outputs.products) }}
    steps:
      - uses: actions/checkout@v5
      # A plan runs no tool, but a step's tool input must resolve to a path.
      - name: Install the tools the recipes name
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends erofs-utils cryptsetup-bin bubblewrap
      - name: Plan ${{ matrix.product }}
        uses: ./
        with:
          product: ${{ matrix.product }}
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
