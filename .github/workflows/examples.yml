name: Examples

# Plans every example product on each push and pull request into next. Plans
# only: no image is built here. A product with no committed gaia.lock cannot
# be planned (`gaia lock` writes it), so it gets a warning instead of a plan.

on:
  push:
    branches:
      - next
    paths:
      - "examples/**"
      - "crates/**"
      - "action.yml"
      - ".github/workflows/examples.yml"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.find.outputs.products }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          set -euo pipefail
          planned=()
          for product in $(find examples/products -name product.toml | sort); do
            if [[ -f "$(dirname "$product")/gaia.lock" ]]; then
              planned+=("$product")
            else
              echo "::warning file=$product::no gaia.lock next to this product; it is not planned until gaia lock writes one"
            fi
          done
          printf '%s\n' "${planned[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))' > products.json
          echo "products=$(cat products.json)" >> "$GITHUB_OUTPUT"

  # gaia, built once in the shipped release profile from the committed
  # Cargo.lock, beside the listing; every plan job takes this binary.
  gaia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p gaia --bin gaia
      - uses: actions/upload-artifact@v4
        with:
          name: gaia
          path: target/release/gaia
          retention-days: 1
          if-no-files-found: error

  plan:
    needs: [list, gaia]
    if: needs.list.outputs.products != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.list.outputs.products) }}
    steps:
      - uses: actions/checkout@v5
      # A plan runs no tool, but a step's tool input must resolve to a path.
      # Microsoft's package repository, which the runner image lists and
      # nothing here installs from, is dropped first: when it refuses (403
      # Forbidden) apt-get update fails the job.
      - name: Install the tools the recipes name
        run: |
          sudo rm -f $(grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null)
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q --no-install-recommends erofs-utils cryptsetup-bin bubblewrap
      - uses: actions/download-artifact@v4
        with:
          name: gaia
          path: ${{ runner.temp }}/gaia
      - name: Plan ${{ matrix.product }}
        uses: ./
        with:
          gaia-bin: ${{ runner.temp }}/gaia/gaia
          product: ${{ matrix.product }}
          command: plan
          args: --recipes ${{ github.workspace }}/recipes
          cache-key: plan
