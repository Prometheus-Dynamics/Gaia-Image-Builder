# A root slot: the built tree as an EROFS image, with dm-verity appended.
# A slot is a file on the data partition; `device` names where it is read
# from. Untested on board.
version = 1
name = "slot"
description = "A root slot: EROFS with a dm-verity tree appended."

[stages]
erofs = "gaia.fs.erofs"
verity = "gaia.verity"

[[connects]]
from = "erofs.image"
to = "verity.image"

[inputs]
build = ["erofs.tree"]
# The image's kernel build, when it has one: its final configuration must
# be able to read the erofs made here, or the build fails saying which
# option is missing.
kernel-build = ["erofs.kernel"]
# The image's own build's host tools: its mkfs.erofs and veritysetup make
# the slot, not this machine's. An image with no OS is given them as tools.
host-tools = ["erofs.tools", "verity.tools"]

[outputs]
slot = "verity.image"
table = "verity.table"

[parameters.compression]
type = "string"
default = "lzma"
description = "EROFS compression. An image with an OS is made with its build's own mkfs.erofs, which writes none, lz4, lz4hc and lzma; deflate and zstd are for a tool given to an image with no OS. lzma is the default because it is the smallest the pinned tool writes, not as a decision: the algorithm is to be decided by a board measurement on the first slot image (lzma, lz4hc, and zstd from an unpinned tool for comparison)."
sets = ["erofs.compression"]

[parameters.cluster]
type = "int"
default = 0
description = "The most bytes of a compressed cluster, a multiple of 4096; 0 is the tool's default, one block. Bigger is smaller on disk and costs RAM and time to read."
sets = ["erofs.cluster"]

[parameters.level]
type = "int"
default = 0
description = "The compressor's level; 0 is its default."
sets = ["erofs.level"]

[parameters.device]
type = "string"
description = "Where the slot is read from: its file, or a device. The verity tree is in it too."
sets = ["verity.device"]
