# A simulated x86_64 target anyone can build and run without a board: a
# Buildroot base (glibc, systemd, no kernel or bootloader) split into
# layers, and an app layer built outside Buildroot, all written as an OCI
# image that podman or docker run with systemd as init.
#
# The app layer is the fast path. The app is not in the image feed: the
# assembly copies it from the artifact's output into its own tree, so a
# change to the app rebuilds the app and the assembly only. Buildroot, and
# the base and platform layers, are reused.
#
#   gaia run examples/sim-x86_64/build.toml
#   tar -C .gaia/examples/sim-x86_64/out/images/sim.oci -cf sim.tar .
#   podman load -i sim.tar && podman run --rm -it --systemd=always sim-x86_64:dev

config = 3
build_name = "sim-x86_64"
version = "0.1.0"
description = "Simulated x86_64 target: a layered Buildroot base and an app layer, as an OCI image."
target = "sim-x86_64"
profile = "release"

[workspace]
root_dir = "examples/sim-x86_64"
build_dir = "../../.gaia/examples/sim-x86_64/build"

[[workspace.named_paths]]
alias = "assets"
path = "assets"
kind = "host"

[providers.buildroot]
timeout_seconds = 14400

# Gaia runs cargo for the app.
[providers.rust]
allow_nested_build = true

[cache]
downloads = "../../.gaia/cache/buildroot/dl"

[cache.ccache]
enabled = true
dir = "../../.gaia/cache/buildroot/ccache"

[[sources]]
id = "buildroot"
kind = "git"
repo = "https://gitlab.com/buildroot.org/buildroot.git"
tag = "2026.02.3"
refresh = "never"
pin = "locked"

[[sources]]
id = "app-source"
kind = "path"
path = "app"
identity_ignore = ["target", ".gaia"]
refresh = "never"
pin = "locked"

# The Buildroot toolchain, read from the image's output tree once the image
# base is prepared, so the app links against the image's own glibc.
[[toolchains]]
id = "sim"
kind = "buildroot-sdk"
path = "${workspace.build_dir}/image/buildroot-output/host"
triple = "x86_64-buildroot-linux-gnu"
sysroot = "x86_64-buildroot-linux-gnu/sysroot"
rust_target = "x86_64-unknown-linux-gnu"

[[artifacts]]
id = "sim-app"
kind = "rust"
package = "sim-app"
source = "app-source"
profile = "${build.profile}"
toolchain = "sim"
after_image_prepare = true
output_path = "${outputs.dir}/artifacts/sim-app"

# The simulated board: its description, and an fstab without the
# /dev/root remount a container refuses. Both go in the platform layer.
[[stage.files]]
id = "sim-board"
src = "${assets}/etc/sim/board"
dest = "/etc/sim/board"
origin = "static-asset"

[[stage.files]]
id = "sim-fstab"
src = "${assets}/etc/fstab"
dest = "/etc/fstab"
origin = "static-asset"

[image]
kind = "buildroot"
source = "buildroot"
defconfig_path = "${assets}/sim_x86_64_defconfig"
external_tree_mode = "disabled"

[image.feed]
stage_files = ["sim-board", "sim-fstab"]

[image.layers]
order = ["base", "platform"]
default = "base"
erofs = false
# Buildroot's skeleton has an /etc/fstab too: the platform layer's ships.
overrides = ["/etc/fstab"]

[image.layers.platform]
stage = ["sim-board", "sim-fstab"]

[[image.expected_images]]
name = "rootfs.tar"
format = "tar"
required = true

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "${provider.images}"

# The app layer, straight from the artifact's output.
[[image.assembly.trees]]
id = "app"
path = "${assembly.work}/app"

[[image.assembly.files]]
tree = "app"
src = "${outputs.dir}/artifacts/sim-app"
dest = "usr/bin/sim-app"
mode = "0755"

[[image.assembly.files]]
tree = "app"
src = "${assets}/sim-app.service"
dest = "usr/lib/systemd/system/sim-app.service"

[[image.assembly.symlinks]]
tree = "app"
path = "etc/systemd/system/multi-user.target.wants/sim-app.service"
target = "/usr/lib/systemd/system/sim-app.service"

[[image.assembly.oci]]
id = "sim"
dest = "${assembly.out}/sim.oci"
layers = [
  { tar = "${provider.images}/layers/base.tar" },
  { tar = "${provider.images}/layers/platform.tar" },
  { tree = "app" },
]
ref = "sim-x86_64:dev"

[image.assembly.oci.config]
architecture = "amd64"
entrypoint = ["/sbin/init"]
env = ["container=oci"]
working_dir = "/"
stop_signal = "SIGRTMIN+3"

[reporting]
summary = true
manifest = true

[outputs]
dir = "../../.gaia/examples/sim-x86_64/out"
images_dir = "${outputs.dir}/images"
report = true
