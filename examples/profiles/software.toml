# Shared by both device profiles: the software, and the Buildroot base the
# raze profile builds on. The systemcore profile (profiles/systemcore.toml)
# switches the image to `kind = "none"`, which replaces the kind-specific
# fields below and keeps `[image.output]`.

[image]
kind = "buildroot"
source = "buildroot-source"
defconfig_path = "@assets/base.defconfig"
external_tree_mode = "disabled"

[image.feed]
install_entries = ["install-helios-api", "install-helios-cli"]

[[image.expected_images]]
name = "rootfs.tar"
format = "tar"
required = true

[image.output]
collect_dir = "${workspace.out_dir}/images"
emit_report = true

[[sources]]
id = "helios-src"
kind = "path"
path = "app"
identity_ignore = ["target", ".gaia"]
refresh = "never"
pin = "locked"

[[artifacts]]
id = "helios-api"
kind = "rust"
package = "helios-app"
target_name = "helios-api"
source = "helios-src"
profile = "${build.profile}"
install_name = "helios-api"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-api"
output_path = "${workspace.out_dir}/artifacts/helios-api"

[[artifacts]]
id = "helios-cli"
kind = "rust"
package = "helios-app"
target_name = "helios-cli"
source = "helios-src"
profile = "${build.profile}"
install_name = "helios-cli"
install_class = "binary"
install_dest_hint = "/usr/bin/helios-cli"
output_path = "${workspace.out_dir}/artifacts/helios-cli"

[[install]]
id = "install-helios-api"
artifact = "helios-api"
dest = "/usr/bin/helios-api"
replace = true
mode = 493
owner = "root"
group = "root"

[[install]]
id = "install-helios-cli"
artifact = "helios-cli"
dest = "/usr/bin/helios-cli"
replace = true
mode = 493
owner = "root"
group = "root"
