# BPI-CanMV-K230D-Zero (bench product). Builds (2026-11-21, mainline 7.3.3
# with LLVM, Buildroot 2026.08); NOT known bootable: no U-Boot environment is
# written (the family gives no environment file and this board none), so U-Boot
# starts with its compiled-in default environment, whose bootcmd is not this
# image's. The SPL, U-Boot and OpenSBI wraps are the family's, as for the
# AI-CAM. SD card only. Untested on board.
version = 1
name = "k230d-zero"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.08"

[components]
usb-gadget-network = "../../components/usb-gadget-network/component.toml"

[[images]]
name = "k230d-zero"
board = "../../boards/k230d-zero/board.toml"
components = ["usb-gadget-network"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
id = "k230d-zero"
root_bootable = false
