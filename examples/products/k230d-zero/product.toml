# BPI-CanMV-K230D-Zero (bench product). NOT BOOTABLE, not built tonight: the
# environment area (u-boot-env.bin, 3 MiB) has no producer yet (the gaia.uboot.env
# node is not wired to a board key), so the build fails at that area's blob. The SPL,
# U-Boot and OpenSBI wraps are the family's, as for the AI-CAM. SD card only.
version = 1
name = "k230d-zero"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.08"

[components]
usb-gadget-network = "../../components/usb-gadget-network/component.toml"

[[images]]
name = "k230d-zero"
board = "../../boards/k230d-zero/board.toml"
components = ["usb-gadget-network"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
id = "k230d-zero"
root_bootable = false
