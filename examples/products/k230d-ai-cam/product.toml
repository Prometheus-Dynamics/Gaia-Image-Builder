# CanMV K230D AI-CAM (bench product, Canaan's junroc board): the K230 family's
# boot chain (vendor U-Boot k230d_canmv_junroc_ai_cam with the console on UART0 and
# the environment at 3 MiB; OpenSBI; mainline Linux 7.3.3 with the board's dts), on
# Buildroot. The image goes to an SD card ONLY (removable); it is never written to
# internal flash, so a bad image is recovered by swapping the card.
# Untested on board, and never built. Interim, until the gaia.firmware.k230 step is a node:
# - the wrap tool is given beside this file: interim: the wrap tool is given beside this
#   file; build it with `cargo build --release -p gaia-k230-image` and link or copy
#   target/release/k230-firstage here (k230-firstage, not committed: see .gitignore).
#   Gaia stores that single file as 0644 (the execute bit is dropped), so the
#   post-image copies it and sets +x itself.
#   Tonight it is a symlink to the staged release binary (sha256 b425fb06…, built
#   from crates/nodes/k230-image at 292c9f31). The OS fragment names it as
#   @here@/k230-firstage, so it reaches post-image.sh as its second argument.
# - the environment and the boot files are made by post-image.sh (U-Boot's own
#   mkenvimage from the build tree, and the kernel Image into /boot by Buildroot).
version = 1
name = "k230d-ai-cam"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.02.3"

[components]
usb-gadget-network = "../../components/usb-gadget-network/component.toml"

[[images]]
name = "k230d-ai-cam"
board = "../../boards/k230d-ai-cam/board.toml"
components = ["usb-gadget-network"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
id = "k230d-ai-cam"
