# CanMV K230D AI-CAM (bench product, Canaan's junroc board): the K230 family's boot
# chain on Buildroot: the vendor U-Boot (k230d_canmv_junroc_ai_cam, console on UART0,
# environment at 3 MiB), OpenSBI, mainline Linux 7.3.3 with the board's dts. The
# SPL, U-Boot and OpenSBI areas are wrapped by gaia.firmware.k230 (the family's wrap
# keys). The image goes to an SD card ONLY (removable), never internal flash.
# Untested on board.
version = 1
name = "k230d-ai-cam"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.08"

[components]
usb-gadget-network = "../../components/usb-gadget-network/component.toml"

[[images]]
name = "k230d-ai-cam"
board = "../../boards/k230d-ai-cam/board.toml"
components = ["usb-gadget-network"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
id = "k230d-ai-cam"
# U-Boot reads partition 1 by number (ext4load mmc 1:1); nothing scans for a
# bootable one, and the board's layout marks none.
root_bootable = false
