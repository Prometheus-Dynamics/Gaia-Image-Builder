# Luckfox Aura bench image: mainline Linux 7.3.3 on the RV1126B family, a
# serial console on UART0 and a root shell on it, on a microSD card. No
# network: the Aura's Ethernet is not in the 7.3.3 driver set. Flashed by
# hand. Untested on board.
version = 1
name = "luckfox-aura-bench"

[sources.buildroot]
git = "https://gitlab.com/buildroot.org/buildroot.git"
ref = "2026.02.3"

[components]
extlinux = "../../components/extlinux-luckfox-aura/component.toml"

[[images]]
name = "luckfox-aura-bench"
board = "../../boards/luckfox-aura/board.toml"
components = ["extlinux"]
os = { provider = "buildroot", source = "buildroot", fragments = ["os.fragment"] }
recipe = "sd-image"
budget = "1G"

[images.settings]
id = "luckfox-aura-bench"
