config = 3
extends = "../rk35xx/base.toml"
build_name = "rock-5c"
description = "Radxa ROCK 5C (RK3588S2): mainline Linux 7.3, U-Boot and TF-A on the RK35xx base, with A/B root slots and SSH. Written, untested on board."
target = "rock-5c"
# Atlas's device package: board-lite, which identifies the board to Atlas on
# the LAN, read-only.
imports = [
  { source = "atlas", path = "devices/radxa-rock-5c/gaia/device.toml" },
]

[workspace]
root_dir = "examples/boards/rock-5c"
build_dir = "../../../.gaia/examples/rock-5c/build"

[cpu]
profile = "cortex-a76.cortex-a55"

[[sources]]
id = "atlas"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager.git"
rev = "d53912e6173d4883704dbd3ae69035ac19224f92"
refresh = "never"
pin = "locked"

# What the ROCK 5C has that the base does not: the RK3588S2 and its blobs.
[image]
config_overrides = [
  ["BR2_cortex_a76_a55", "y"],
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"rock5c\""],
  ["BR2_LINUX_KERNEL_INTREE_DTS_NAME", "\"rockchip/rk3588s-rock-5c\""],
  ["BR2_PACKAGE_ROCKCHIP_RKBIN_TPL_FILENAME", "\"bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.18.bin\""],
  ["BR2_TARGET_ARM_TRUSTED_FIRMWARE_PLATFORM", "\"rk3588\""],
  ["BR2_TARGET_UBOOT_BOARD_DEFCONFIG", "\"rock-5c-rk3588s\""],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"RK3588MINIALL.ini rockchip/rk3588s-rock-5c\""],
]

# The maskrom loader, beside the disk, where rkdeveloptool and Atlas look.
[[image.expected_images]]
name = "rk3588_spl_loader_v1.18.113.bin"
format = "file"
required = true

[outputs]
dir = "../../../.gaia/examples/rock-5c/out"
