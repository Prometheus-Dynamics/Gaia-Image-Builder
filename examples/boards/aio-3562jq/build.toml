config = 3
build_name = "aio-3562jq"
version = "0.1.0"
description = "Firefly AIO-3562JQ (RK3562): Buildroot image on Firefly's vendor 5.10 kernel and vendor U-Boot, with A/B root slots and SSH. Written, untested on board."
target = "aio-3562jq"
profile = "release"
# No Atlas device package for this board yet (Atlas has none under
# devices/), so no board-lite.

[workspace]
root_dir = "examples/boards/aio-3562jq"
build_dir = "../../../.gaia/examples/aio-3562jq/build"

[[workspace.named_paths]]
alias = "assets"
path = "assets"
kind = "host"

[cpu]
profile = "cortex-a53"

[providers.buildroot]
timeout_seconds = 14400

[cache]
downloads = "../../../.gaia/cache/buildroot/dl"

[cache.ccache]
enabled = true
dir = "../../../.gaia/cache/buildroot/ccache"

[[sources]]
id = "buildroot"
kind = "git"
repo = "https://gitlab.com/buildroot.org/buildroot.git"
tag = "2026.02.3"
refresh = "never"
pin = "locked"

# Rockchip's blobs: the DDR init, SPL, BL31, OP-TEE and the maskrom loader's parts.
[[sources]]
id = "rkbin"
kind = "git"
repo = "https://github.com/rockchip-linux/rkbin.git"
rev = "3e288fe814e059dd06833495f845cab04ac20a5c"
refresh = "never"
pin = "locked"

# Firefly's vendor U-Boot for the RK3562 (GPL-2.0); its kernel (5.10.160)
# is a Buildroot custom tarball, in the defconfig.
[[sources]]
id = "firefly-u-boot"
kind = "git"
repo = "https://gitlab.com/firefly-linux/u-boot.git"
rev = "89e1f0c4bdb92f316677466ac0afb679ce376122"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot"
defconfig_path = "${assets}/aio3562jq_defconfig"
external_tree_mode = "disabled"
config_overrides = [
  ["BR2_LINUX_KERNEL_PATCH", "${assets}/linux-no-gcc-wrapper.patch"],
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "${assets}/linux.fragment"],
  ["BR2_ROOTFS_POST_BUILD_SCRIPT", "${assets}/post-build.sh"],
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "${assets}/post-image.sh"],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"${source.rkbin.path} ${source.firefly-u-boot.path}\""],
]

[[image.expected_images]]
name = "rkbin-LICENSE.txt"
format = "file"
required = true

[[image.expected_images]]
name = "idblock.bin"
format = "file"
required = true

[[image.expected_images]]
name = "uboot.img"
format = "file"
required = true

[[image.expected_images]]
name = "rootfs.ext4"
format = "ext4"
required = true

# The maskrom loader: collected into the image output dir, beside the
# disk, where rkdeveloptool and Atlas look for it.
[[image.expected_images]]
name = "rk3562_loader_v1.10.108.bin"
format = "file"
required = true

# Dev signing with Atlas's dev key (minisign, no password): the path is in
# ATLAS_DEV_SIGNING_KEY, outside any repo. Without it the image builds
# unsigned with a warning. A release key is the user's and set elsewhere.
[image.signing]
kind = "minisign"
key = "env:ATLAS_DEV_SIGNING_KEY"
outputs = ["*.img.xz"]
optional = true

[reporting]
summary = true
manifest = true

[outputs]
dir = "../../../.gaia/examples/aio-3562jq/out"
images_dir = "${outputs.dir}/images"
archive_name = "${build.name}-${build.version}.img.xz"
report = true

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "${provider.images}"

# /data, empty, labelled, mounted by the system on first boot.
[[image.assembly.trees]]
id = "data"
path = "${assembly.work}/data"

[[image.assembly.files]]
tree = "data"
content = "AIO-3562JQ data partition\n"
dest = "README"

[[image.assembly.filesystems]]
id = "data"
kind = "ext4"
source_tree = "data"
output = "${assembly.work}/data.ext4"
size = "64M"
label = "data"

# SD card or eMMC, the vendor layout: the boot ROM reads the idblock (DDR
# init and SPL) from sector 64; the SPL reads uboot.img (U-Boot, BL31,
# OP-TEE) from the partition named "uboot" at 8 MiB. The vendor U-Boot keeps
# no environment on disk and its distro boot reads extlinux.conf from the
# bootable slot A.
[[image.assembly.disks]]
id = "sdcard"
output = "${assembly.out}/sdcard.img"
partition_table = "gpt"

[[image.assembly.disks.partitions]]
name = "idblock"
image = "${provider.images}/idblock.bin"
offset = "32K"
table = false

[[image.assembly.disks.partitions]]
name = "uboot"
image = "${provider.images}/uboot.img"
offset = "8M"
size = "4M"

[[image.assembly.disks.partitions]]
name = "rootfs-a"
type_alias = "linux-root-arm64"
image = "${provider.images}/rootfs.ext4"
size = "512M"
bootable = true

[[image.assembly.disks.partitions]]
name = "rootfs-b"
type_alias = "linux-root-arm64"
size = "512M"
wipe = true

[[image.assembly.disks.partitions]]
name = "data"
image = "${assembly.work}/data.ext4"
