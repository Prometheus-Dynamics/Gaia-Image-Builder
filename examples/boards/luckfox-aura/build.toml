config = 3
extends = "../rk35xx/base.toml"
build_name = "luckfox-aura"
description = "Luckfox Aura (RV1126B, four Cortex-A53): the RK35xx base. NOT BUILDABLE YET: Linux 7.3.3 has only the RV1126B's clock and reset drivers, U-Boot v2026.10 and TF-A v2.15.0 none of it."
target = "luckfox-aura"

[workspace]
root_dir = "examples/boards/luckfox-aura"
build_dir = "../../../.gaia/examples/luckfox-aura/build"

[cpu]
profile = "cortex-a53"

# The Aura's differences from the base, for when the SoC is in mainline. The
# device tree, U-Boot defconfig and TF-A platform names below do not exist
# upstream yet, and are the names that follow the trees' conventions: the
# build stops at the first of them. rkbin 3e288fe has the DDR init and a
# closed BL31 (bin/rv11/rv1126b_bl31_v1.13.elf); Buildroot's pinned rkbin
# must reach that commit too, and TF-A source is preferred over that BL31.
[image]
config_overrides = [
  ["BR2_cortex_a53", "y"],
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"aura\""],
  ["BR2_LINUX_KERNEL_INTREE_DTS_NAME", "\"rockchip/rv1126b-luckfox-aura\""],
  ["BR2_PACKAGE_ROCKCHIP_RKBIN_TPL_FILENAME", "\"bin/rv11/rv1126b_ddr_lp4x_1332MHz_tb_v1.10.bin\""],
  ["BR2_TARGET_ARM_TRUSTED_FIRMWARE_PLATFORM", "\"rv1126b\""],
  ["BR2_TARGET_UBOOT_BOARD_DEFCONFIG", "\"luckfox-aura-rv1126b\""],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"RV1126BMINIALL.ini rockchip/rv1126b-luckfox-aura\""],
]

[outputs]
dir = "../../../.gaia/examples/luckfox-aura/out"
