# Luckfox Aura (RV1126B, Cortex-A53) on the RV1126B family: a microSD card
# is its only storage in the schematic (Hardware/Schematic/Luckfox-Aura.pdf).
# Serial console on UART0 at 1500000 baud. Ethernet, USB and the rest are not
# described (see assets/dts). Untested on board.
version = 1
extends = "../rv1126b/family.toml"
name = "luckfox-aura"
description = "Luckfox Aura (RV1126B)"

[target]
cpu = "cortex-a53"

[kernel]
device_tree = "rockchip/rv1126b-luckfox-aura"
device_tree_dir = "assets/dts"
storage_drivers = ["CONFIG_MMC=y", "CONFIG_MMC_BLOCK=y", "CONFIG_MMC_DW=y", "CONFIG_MMC_DW_ROCKCHIP=y"]
cmdline = "earlycon console=ttyS0,1500000n8"
