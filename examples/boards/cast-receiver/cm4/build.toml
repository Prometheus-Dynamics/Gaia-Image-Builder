config = 3
build_name = "cm4-cast-receiver"
version = "0.1.0"
description = "Raspberry Pi CM4 (BCM2711): a cast receiver appliance. AirPlay mirroring and audio (UxPlay) and a DLNA/UPnP renderer (gmrender-resurrect), played full-screen on HDMI through kmssink with the V4L2 hardware H.264 decoder; an idle screen with the name and IP otherwise. Read-only EROFS root. Written, untested on board."
target = "cm4-cast-receiver"
profile = "release"

[workspace]
root_dir = "examples/boards/cast-receiver/cm4"
build_dir = "../../../../.gaia/examples/cm4-cast-receiver/build"

# This board's files, and the external tree both boards share (packages,
# patches, rootfs overlay, kernel fragments, post-build.sh, cast.txt).
[[workspace.named_paths]]
alias = "board"
path = "."
kind = "host"

[[workspace.named_paths]]
alias = "external"
path = "../external"
kind = "host"

# The CM4's four Cortex-A72s (BCM2711, without the crypto extension).
[cpu]
profile = "cortex-a72"

[providers.buildroot]
timeout_seconds = 14400

# Fetch the Buildroot tag on the first run.
[providers.git]
allow_remote_resolution = true

[cache]
downloads = "../../../../.gaia/cache/buildroot/dl"

[cache.ccache]
enabled = true
dir = "../../../../.gaia/cache/buildroot/ccache"

[[sources]]
id = "buildroot"
kind = "git"
repo = "https://gitlab.com/buildroot.org/buildroot.git"
tag = "2026.02.3"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot"
# The board (CPU, kernel, firmware), then the receiver. The defconfig and
# fragment name the overlay, kernel fragments and post-build script as
# $(BR2_EXTERNAL_CAST_PATH)/..., so Buildroot resolves them.
defconfig_path = "${board}/defconfig"
config_fragments = ["${external}/cast.fragment"]
# UxPlay (not in Buildroot) and castidle, the idle screen.
external_tree = "${external}"
external_tree_mode = "required"

[[image.expected_images]]
name = "rootfs.erofs"
format = "file"
required = true

[[image.expected_images]]
name = "sdcard.img"
format = "raw"
required = true

# config.txt's [cm4] sections are evaluated for the CM4.
[image.checks]
pi_model = "cm4"

[reporting]
summary = true
manifest = true

[outputs]
dir = "../../../../.gaia/examples/cm4-cast-receiver/out"
images_dir = "${outputs.dir}/images"
archive_name = "${build.name}-${build.version}.img.xz"
report = true

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "${provider.images}"

# --- p1: boot (FAT) ------------------------------------------------------------
# The Pi 4 firmware, the kernel, the CM4 (and Pi 4 B) device trees, the two
# overlays config.txt loads, and cast.txt, the user's settings file.
[[image.assembly.trees]]
id = "boot"
path = "${assembly.work}/boot"

[[image.assembly.files]]
tree = "boot"
src = "${board}/config.txt"
dest = "config.txt"

[[image.assembly.files]]
tree = "boot"
src = "${board}/cmdline.txt"
dest = "cmdline.txt"

[[image.assembly.files]]
tree = "boot"
src = "${external}/cast.txt"
dest = "cast.txt"

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/start4.elf"
dest = "start4.elf"

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/fixup4.dat"
dest = "fixup4.dat"

[[image.assembly.files]]
tree = "boot"
src_glob = "${provider.buildroot_output}/images/bcm2711-*.dtb"
dest = "."

# config.txt names vc4-kms-v3d-pi4 directly; overlay_map.dtb is kept for the firmware.
[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/overlay_map.dtb"
dest = "overlays/overlay_map.dtb"

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/vc4-kms-v3d-pi4.dtbo"
dest = "overlays/vc4-kms-v3d-pi4.dtbo"

[[image.assembly.files]]
tree = "boot"
src = "${provider.buildroot_output}/images/rpi-firmware/overlays/disable-bt.dtbo"
dest = "overlays/disable-bt.dtbo"

[[image.assembly.transforms]]
kind = "gzip"
src = "${provider.buildroot_output}/images/Image"
dest = "${assembly.tree.boot}/kernel8.img"
deterministic = true

[[image.assembly.filesystems]]
id = "boot"
kind = "vfat"
source_tree = "boot"
output = "${provider.images}/boot.vfat"
size = "24M"

# --- the disk ------------------------------------------------------------------
# p1 boot, p2 the read-only EROFS root (cmdline.txt: root=PARTUUID=ca570001-02).
# Nothing is written at run time, so there is no data partition and the root
# is exactly as large as its image.
[[image.assembly.disks]]
id = "sdcard"
output = "${provider.images}/sdcard.img"
partition_table = "mbr"
signature = "0xca570001"
first_lba = 2048
alignment_lba = 2048

[[image.assembly.disks.partitions]]
name = "boot"
type_alias = "fat32-lba"
bootable = true
image = "${provider.images}/boot.vfat"
size = "24M"

[[image.assembly.disks.partitions]]
name = "rootfs"
type_alias = "linux"
image = "${provider.images}/rootfs.erofs"
