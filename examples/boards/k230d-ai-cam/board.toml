# CanMV K230D AI-CAM on the K230 family: its own device tree (SD and USB
# nodes written from the SDK's addresses and the bindings, not checked on
# hardware). Untested on board.
version = 1
extends = "../k230/family.toml"
name = "k230d-ai-cam"
description = "CanMV K230D AI-CAM (K230D)"

[kernel]
device_tree = "canaan/k230d-ai-cam"
device_tree_dir = "assets/dts"

# The AI-CAM's U-Boot is the vendor's own board, k230d_canmv_junroc_ai_cam, from
# Canaan's k230_linux_sdk at fc6cc215: its device tree (pad table and bank
# modes, from the schematic), board files and defconfig, all in the family's
# patch byte for byte. One change on top, for the bench (agreed): U-Boot's
# console is UART0 (the CH342K bridge), not the vendor's UART2. That is the
# second patch below, only the stdout-path line.
[bootloader]
defconfig = "k230d_canmv_junroc_ai_cam"
# After the family's patches (the SDK's U-Boot overlay and the SPL start
# fix), this board's console on UART0.
patches = [
  { file = "assets/patches/u-boot-v2022.10-k230d-ai-cam-console-uart0.patch" },
]

# The AI-CAM's partitions: the family's layout restated here, because a board's
# partitions replace the family's whole list. Only the two environment copies differ:
# they are this board's files, the redundant blob (mkenvimage -s 0x2000 -r; U-Boot's
# copy 1 at 3 MiB and copy 2 at 3.125 MiB), regenerated by the test in
# crates/nodes/disk/tests/env_assets.rs from assets/u-boot-env.txt.

[[partitions]]
name = "spl"
role = "bootloader"
offset = "1M"
in_table = false
content = "u-boot-spl.bin"
wrap = "k230-first-stage"

[[partitions]]
name = "spl-copy"
role = "bootloader"
offset = "1536K"
in_table = false
content = "u-boot-spl.bin"
wrap = "k230-first-stage"

[[partitions]]
name = "uboot"
role = "bootloader"
offset = "2M"
in_table = false
content = "u-boot.bin"
wrap = "k230-u-boot"

# The environment, copy 1: 128 KiB slot at 3 MiB; the environment is 8 KiB.
[[partitions]]
name = "uboot-env"
role = "raw"
offset = "3M"
size = "128K"
in_table = false
file = "assets/u-boot-env.bin"

# The environment, copy 2 (redundant): 128 KiB slot at 3.125 MiB.
[[partitions]]
name = "uboot-env-redund"
role = "raw"
offset = "3200K"
size = "128K"
in_table = false
file = "assets/u-boot-env-redund.bin"

# OpenSBI (fw_jump) as a plain uImage (kernel type, no K230 header), read by the
# environment's `mmc read 0x3000000 0x1c00 <count>`. 0x380000 + ~140 KB < 4 MiB.
[[partitions]]
name = "uboot-opensbi"
role = "raw"
offset = "3584K"
in_table = false
content = "fw_jump.bin"
wrap = "opensbi-uimage"

# The root filesystem: partition 1 of the table, the one U-Boot's bootcmd reads
# (ext4load mmc 1:1 /boot/Image). Its /boot holds Image and the device tree.
[[partitions]]
name = "rootfs"
role = "rootfs"
offset = "4M"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"

[[partitions]]
name = "data"
role = "data"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
