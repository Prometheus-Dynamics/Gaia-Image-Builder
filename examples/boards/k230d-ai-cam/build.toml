config = 3
extends = "../k230d-zero/base.toml"
build_name = "k230d-ai-cam"
description = "CanMV K230D AI-CAM: mainline Linux 7.3.3 on the K230D Zero's SDK boot chain, A/B root slots on SD, SSH over USB. Written, untested on board."
target = "k230d-ai-cam"

[inputs.lens]
description = "Field of view of the fitted lens, in degrees"
kind = "enum"
default = "72"
choices = ["72", "140"]

# The base's workspace root stays (the SDK checkout is under it).
[workspace]
build_dir = "../../../.gaia/examples/k230d-ai-cam/build"

[[workspace.named_paths]]
alias = "ai_cam"
path = "../k230d-ai-cam/assets"
kind = "host"

# The kernel as an unpacked tree (override_srcdirs below): the SDK's Buildroot
# applies its patches for the SDK kernel to any Linux it downloads, and they
# do not apply to 7.3.3.
[[sources]]
id = "linux"
kind = "archive"
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.3.tar.xz"
sha256 = "79c66dde66cd96877fcde8f7d36aec946b1f423d2b97b5a7b1751b75c764f3d1"
strip_components = 1
refresh = "never"
pin = "locked"

# The kernel is the only real change from the K230D Zero: mainline 7.3.3
# with this board's device tree. The boot chain stays the SDK's: mainline
# U-Boot has no K230 SPL or MMC driver (doc/board/canaan/k230_canmv.rst).
[image]
override_srcdirs = [
  ["linux", "${source.linux.path}"],
]
config_overrides = [
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"k230d-ai-cam\""],
  ["BR2_TARGET_GENERIC_ISSUE", "\"Welcome to the CanMV K230D AI-CAM\""],
  ["BR2_LINUX_KERNEL_CUSTOM_GIT", "n"],
  ["BR2_LINUX_KERNEL_CUSTOM_VERSION", "y"],
  ["BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE", "\"7.3.3\""],
  ["BR2_LINUX_KERNEL_USE_DEFCONFIG", "n"],
  ["BR2_LINUX_KERNEL_USE_ARCH_DEFAULT_CONFIG", "y"],
  ["BR2_LINUX_KERNEL_INTREE_DTS_NAME", "\"\""],
  ["BR2_LINUX_KERNEL_CUSTOM_DTS_PATH", "${ai_cam}/dts/k230d-ai-cam.dts"],
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "${ai_cam}/linux.fragment"],
  # VGLite needs the SDK kernel's /dev/vg_lite, which mainline does not have.
  ["BR2_PACKAGE_K230_VGLITE", "n"],
  ["BR2_ROOTFS_POST_BUILD_SCRIPT", "${assets}/post-build.sh ${ai_cam}/post-build.sh"],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"k230d-ai-cam ${source.buildroot.path}/../.. ${input.lens}\""],
]

[outputs]
dir = "../../../.gaia/examples/k230d-ai-cam/out"
