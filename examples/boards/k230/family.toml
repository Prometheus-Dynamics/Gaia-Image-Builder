# Canaan K230D (RISC-V, RVV 1.0, 128 MB) on the K230 family: mainline Linux
# 7.3.3 for the kernel and the Canaan K230 SDK's U-Boot 2022.10 for the boot
# chain. Mainline U-Boot has no K230 SPL or MMC driver, so the SDK's U-Boot
# (k230d_canmv_bpi) is the bootloader. Untested on board, and not built.
#
# The SPL, U-Boot and OpenSBI areas are wrapped by gaia.firmware.k230 (their `wrap`
# keys, crates/nodes/k230-image): the K230 headers and the uImage, from the files
# Buildroot installs in the bootloader output (images/).
version = 1

[target]
arch = "riscv64"
os = "linux"

[sources.linux]
git = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
ref = "v7.3.3"

[sources.u-boot]
git = "https://source.denx.de/u-boot/u-boot.git"
ref = "v2022.10"

# Built with LLVM (clang and Gaia's pinned LLVM tools) from the start: a
# riscv64 kernel with Rust needs clang (HAVE_RUST depends on CC_IS_CLANG),
# and the second K230D image carries Lemnos's Rust module. CONFIG_RUST and
# CONFIG_MODULES are not set yet; they come with that module.
[kernel]
source = "linux"
defconfig = "defconfig"
fragments = ["assets/linux.fragment"]
toolchain = "llvm"

# The SDK's U-Boot 2022.10 overlay, trimmed to what the K230D configs build, as
# one patch against upstream v2022.10. Generated, not hand-written: the command,
# the dropped paths and the sizes are in
# assets/patches/u-boot-v2022.10-k230d.generation.txt (vendor commit fc6cc215).
[bootloader]
source = "u-boot"
patches = [
    { file = "assets/patches/u-boot-v2022.10-k230d.patch" },
    { file = "assets/patches/u-boot-v2022.10-k230-start-no-timing-prologue.patch" },
]
fragments = ["assets/u-boot.fragment"]

# The K230 boot ROM and SPL (the layout of the SDK's genimage, without its
# MBR: GPT here). Outside the partition table, so the table starts at 4 MiB.
[[partitions]]
name = "spl"
role = "bootloader"
offset = "1M"
in_table = false
content = "u-boot-spl.bin"
wrap = "k230-first-stage"

[[partitions]]
name = "spl-copy"
role = "bootloader"
offset = "1536K"
in_table = false
content = "u-boot-spl.bin"
wrap = "k230-first-stage"

[[partitions]]
name = "uboot"
role = "bootloader"
offset = "2M"
in_table = false
content = "u-boot.bin"
wrap = "k230-u-boot"

# The U-Boot environment: copy 1 at 3 MiB and copy 2 at 3.125 MiB (u-boot.fragment).
# Both are 128 KiB slots; the environment is 8 KiB. The content is the board's (a
# board gives its own `file`); this family gives none, so no environment is written.
[[partitions]]
name = "uboot-env"
role = "raw"
offset = "3M"
size = "128K"
in_table = false

[[partitions]]
name = "uboot-env-redund"
role = "raw"
offset = "3200K"
size = "128K"
in_table = false

# OpenSBI (fw_jump) as a plain uImage (kernel type, no K230 header), read by the
# environment's `mmc read 0x3000000 0x1c00 <count>`. 0x380000 + ~140 KB < 4 MiB.
[[partitions]]
name = "uboot-opensbi"
role = "raw"
offset = "3584K"
in_table = false
content = "fw_jump.bin"
wrap = "opensbi-uimage"

# The root filesystem: partition 1 of the table, the one U-Boot's bootcmd reads
# (ext4load mmc 1:1 /boot/Image). Its /boot holds Image and the device tree.
[[partitions]]
name = "rootfs"
role = "rootfs"
offset = "4M"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"

[[partitions]]
name = "data"
role = "data"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"

[disk]
scheme = "gpt"

[flash]
methods = ["sd-card", "usb-boot"]
medium = "sd"
