# What every Radxa Cubie on the Allwinner A733 shares, on the same mainline
# Buildroot base as the RK35xx boards with the Rockchip parts swapped for
# Allwinner's. NOT BUILDABLE YET: nothing of the A733 is in Linux 7.3.3,
# U-Boot v2026.10 or TF-A v2.15.0, and its DRAM init is a closed blob with no
# redistribution grant. Each board's build.toml names itself and its dts.
config = 3
extends = "../rk35xx/base.toml"

[cpu]
profile = "cortex-a76.cortex-a55"

# The TF-A platform and U-Boot defconfig do not exist upstream yet; these
# names follow the trees' conventions, and the build stops at them.
[image]
config_overrides = [
  ["BR2_cortex_a76_a55", "y"],
  ["BR2_PACKAGE_ROCKCHIP_RKBIN", "n"],
  ["BR2_TARGET_UBOOT_NEEDS_ROCKCHIP_RKBIN", "n"],
  ["BR2_TARGET_ARM_TRUSTED_FIRMWARE_PLATFORM", "\"sun60i_a733\""],
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "\"\""],
]

[[image.expected_images]]
name = "rkbin-LICENSE.txt"
format = "file"
required = false

[[image.expected_images]]
name = "u-boot-rockchip.bin"
format = "file"
required = false

[[image.expected_images]]
name = "u-boot-sunxi-with-spl.bin"
format = "file"
required = true

# The boot ROM reads the SPL and U-Boot at 128 KiB (as DockSeed/a733-bootchain
# tested on the A7S's SD card). A disk replaces the base's whole, so the
# partitions after U-Boot repeat it.
[[image.assembly.disks]]
id = "sdcard"
output = "${assembly.out}/sdcard.img"
partition_table = "gpt"

[[image.assembly.disks.partitions]]
name = "u-boot"
image = "${provider.images}/u-boot-sunxi-with-spl.bin"
offset = "128K"
table = false

[[image.assembly.disks.partitions]]
name = "uboot-env"
type = "3de21764-95bd-54bd-a5c3-4abe786f38a8"
offset = "16M"
size = "64K"
wipe = true

[[image.assembly.disks.partitions]]
name = "rootfs-a"
type_alias = "linux-root-arm64"
image = "${provider.images}/rootfs.ext4"
size = "512M"
bootable = true

[[image.assembly.disks.partitions]]
name = "rootfs-b"
type_alias = "linux-root-arm64"
size = "512M"
wipe = true

[[image.assembly.disks.partitions]]
name = "data"
image = "${assembly.work}/data.ext4"
