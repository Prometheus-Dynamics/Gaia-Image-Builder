config = 3
extends = "../rk35xx/base.toml"
build_name = "zero-3e"
description = "Radxa ZERO 3E (RK3566): mainline Linux 7.3, U-Boot and TF-A on the RK35xx base, Ethernet DHCP plus a USB gadget network, A/B root slots and SSH. Written, untested on board."
target = "zero-3e"

[workspace]
root_dir = "examples/boards/zero-3e"
build_dir = "../../../.gaia/examples/zero-3e/build"

[[workspace.named_paths]]
alias = "assets"
path = "assets"
kind = "host"

[cpu]
profile = "cortex-a55"

# What the ZERO 3E has that the base does not: the RK3566 and its blobs,
# and the OTG port as a USB gadget network beside the gigabit Ethernet
# (eth0, DHCP, the base's), from the board's device tree with the OTG port
# in peripheral mode (assets/dts).
[image]
config_overrides = [
  ["BR2_cortex_a55", "y"],
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"zero3e\""],
  ["BR2_LINUX_KERNEL_INTREE_DTS_NAME", "\"rockchip/rk3566-radxa-zero-3e\""],
  ["BR2_LINUX_KERNEL_CUSTOM_DTS_DIR", "${assets}/dts"],
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "${family}/linux.fragment ${assets}/linux.fragment"],
  ["BR2_PACKAGE_BUSYBOX_CONFIG_FRAGMENT_FILES", "${assets}/busybox.fragment"],
  ["BR2_PACKAGE_ROCKCHIP_RKBIN_TPL_FILENAME", "\"bin/rk35/rk3566_ddr_1056MHz_v1.23.bin\""],
  ["BR2_TARGET_ARM_TRUSTED_FIRMWARE_PLATFORM", "\"rk3568\""],
  ["BR2_TARGET_UBOOT_BOARD_DEFCONFIG", "\"radxa-zero-3-rk3566\""],
  ["BR2_ROOTFS_POST_BUILD_SCRIPT", "${family}/post-build.sh ${assets}/post-build.sh"],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"RK3566MINIALL.ini rockchip/rk3566-radxa-zero-3e-gadget\""],
]

# The maskrom loader, beside the disk, where rkdeveloptool and Atlas look.
[[image.expected_images]]
name = "rk356x_spl_loader_v1.23.114.bin"
format = "file"
required = true

[outputs]
dir = "../../../.gaia/examples/zero-3e/out"
