config = 3
build_name = "k230d-zero"
version = "0.1.0"
description = "BPI-CanMV-K230D-Zero (K230D, RVV 1.0): SDK Buildroot with A/B root slots on SD. Written, untested on board."
target = "k230d-zero"
profile = "release"
# Atlas's device package: board-lite, which identifies the board to Atlas on
# the LAN, read-only.
imports = [
  { source = "atlas", path = "devices/bpi-canmv-k230d-zero/gaia/device.toml" },
]

[workspace]
root_dir = "examples/boards/k230d-zero"
build_dir = "../../../.gaia/examples/k230d-zero/build"

[[workspace.named_paths]]
alias = "assets"
path = "assets"
kind = "host"

[cpu]
profile = "xuantie-c908"

[providers.buildroot]
timeout_seconds = 14400

[cache]
downloads = "../../../.gaia/cache/buildroot/dl"

[cache.ccache]
enabled = true
dir = "../../../.gaia/cache/buildroot/ccache"

# The system ccache: the SDK's Buildroot builds its own with host-cmake
# 3.28, which does not build with GCC 16.
[providers.buildroot.host_tools]
ccache = "system,build"

# The K230 Linux SDK's Buildroot tree: Buildroot 2024.02.1 with the SDK's
# overlay, as `make sync` in the SDK (v0.6.1) leaves it. Check the SDK out
# beside this file as `sdk` and run `make -C sdk sync` first (see README).
[[sources]]
id = "buildroot"
kind = "path"
path = "sdk/output/buildroot-2024.02.1"
refresh = "never"
pin = "locked"

# T-Head's toolchain for the C908 (RVV 1.0), as the SDK's README names it.
[[sources]]
id = "xuantie"
kind = "archive"
url = "https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/resource//1721095219235/Xuantie-900-gcc-linux-6.6.0-glibc-x86_64-V2.10.1-20240712.tar.gz"
sha256 = "15d91b6613bb92b4685c474972785a49b6f6ee9fbeefa1faef180e86a2f7e2f3"
strip_components = 1
allow_absolute_symlinks = true
refresh = "never"
pin = "locked"

[[sources]]
id = "atlas"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager.git"
rev = "d53912e6173d4883704dbd3ae69035ac19224f92"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot"
defconfig_path = "${assets}/k230d_zero_defconfig"
external_tree = "${assets}/buildroot"
external_tree_mode = "required"
config_overrides = [
  # Buildroot 2024.02 passes --passive-ftp, which wget2 (Fedora 40 and
  # later) rejects; later Buildroots dropped it.
  ["BR2_WGET", "\"wget -nd -t 3\""],
  ["BR2_TOOLCHAIN_EXTERNAL_PATH", "\"${source.xuantie.path}\""],
  # The SDK's post-image script finds the SDK relative to the output dir
  # and makes its own SD image; this one makes only the boot files, with
  # the SDK root passed in (the Buildroot tree is <sdk>/output/buildroot-*).
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "${assets}/post-image.sh"],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"bananapi-canmv-k230d-zero ${source.buildroot.path}/../..\""],
]

[[image.expected_images]]
name = "rootfs.ext4"
format = "ext4"
required = true

[[image.expected_images]]
name = "boot.ext4"
format = "ext4"
required = true

# The USB burner (post-image.sh): collected into the image output dir,
# beside the SD image, where k230-flash and Atlas look for it.
[[image.expected_images]]
name = "loader_mmc.bin"
format = "file"
required = true

# Dev signing with Atlas's dev key (minisign, no password): the path is in
# ATLAS_DEV_SIGNING_KEY, outside any repo. Without it the image builds
# unsigned with a warning. A release key is the user's and set elsewhere.
[image.signing]
kind = "minisign"
key = "env:ATLAS_DEV_SIGNING_KEY"
outputs = ["sdcard.img"]
optional = true

[reporting]
summary = true
manifest = true

[outputs]
dir = "../../../.gaia/examples/k230d-zero/out"
images_dir = "${outputs.dir}/images"
report = true

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "${provider.images}"

[[image.assembly.trees]]
id = "data"
path = "${assembly.work}/data"

[[image.assembly.files]]
tree = "data"
content = "K230D Zero data partition\n"
dest = "README"

[[image.assembly.filesystems]]
id = "data"
kind = "ext4"
source_tree = "data"
output = "${assembly.work}/data.ext4"
size = "64M"
label = "data"

# SD card, as the SDK's genimage.cfg lays out the loaders: the boot ROM
# reads the SPL (with Canaan's firmware header) at 1 MiB, or its copy at
# 1.5 MiB; U-Boot sits at 2 MiB and its environment at 1.875 and 3.5 MiB.
# U-Boot loads OpenSBI, the kernel and the dtb from partition 1 (boot);
# rootfs-a is partition 2, as in the SDK image, so its root= holds.
[[image.assembly.disks]]
id = "sdcard"
output = "${assembly.out}/sdcard.img"
partition_table = "gpt"

[[image.assembly.disks.partitions]]
name = "spl"
image = "${provider.buildroot_output}/images/uboot/fn_u-boot-spl.bin"
offset = "1M"
table = false

[[image.assembly.disks.partitions]]
name = "spl-copy"
image = "${provider.buildroot_output}/images/uboot/fn_u-boot-spl.bin"
offset = "1536K"
table = false

[[image.assembly.disks.partitions]]
name = "uboot-env"
image = "${provider.buildroot_output}/images/uboot/env.env"
offset = "1920K"
table = false

[[image.assembly.disks.partitions]]
name = "uboot"
image = "${provider.buildroot_output}/images/uboot/fn_ug_u-boot.bin"
offset = "2M"
table = false

[[image.assembly.disks.partitions]]
name = "env"
image = "${provider.buildroot_output}/images/uboot/env.env"
offset = "3584K"
table = false

[[image.assembly.disks.partitions]]
name = "boot"
image = "${provider.images}/boot.ext4"
offset = "30M"
size = "50M"

[[image.assembly.disks.partitions]]
name = "rootfs-a"
type_alias = "linux-root-riscv64"
image = "${provider.images}/rootfs.ext4"
offset = "128M"
size = "512M"

[[image.assembly.disks.partitions]]
name = "rootfs-b"
type_alias = "linux-root-riscv64"
size = "512M"
wipe = true

[[image.assembly.disks.partitions]]
name = "data"
image = "${assembly.work}/data.ext4"
