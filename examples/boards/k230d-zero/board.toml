# BPI-CanMV-K230D-Zero (K230D, RVV 1.0) on the K230 family. The device tree
# is written for mainline 7.3.3 (assets/dts): the SD and USB nodes as the
# AI-CAM's, the board's set from the ruyisdk kernel fork's
# bananapi-canmv-k230d-zero.dts (fork commit ae4a7e6), whose display, touch,
# camera and audio nodes mainline has nothing for. Untested on board.
version = 1
extends = "../k230/family.toml"
name = "k230d-zero"
description = "BPI-CanMV-K230D-Zero (K230D)"

[target]

[kernel]
device_tree = "canaan/bananapi-canmv-k230d-zero"
device_tree_dir = "assets/dts"
fragments = ["../k230/assets/linux.fragment", "assets/linux.fragment"]

# The Zero's own U-Boot defconfig (a family may not name one). The SDK's
# k230d_canmv_bpi differs from the AI-CAM's junroc config only in its device
# tree and board target; its device tree enables mmc0 and mmc1 as the
# AI-CAM's does, so U-Boot's mmc 1 is SDIO1, the TF slot (the board code
# boots from SDIO1), and the family's environment (mmc 1, 3 MiB) is there.
[bootloader]
defconfig = "k230d_canmv_bpi"

# The Zero's partitions: the family's layout restated here, because a board's
# partitions replace the family's whole list. Only the two environment copies
# differ: they are this board's files, the redundant blob (mkenvimage -s 0x2000
# -r; U-Boot's copy 1 at 3 MiB and copy 2 at 3.125 MiB), regenerated by the
# test in crates/nodes/disk/tests/env_assets.rs from assets/u-boot-env.txt.
# The environment is the AI-CAM's with this board's device tree, which the
# kernel build installs into the root filesystem's /boot by its base name.

[[partitions]]
name = "spl"
role = "bootloader"
offset = "1M"
in_table = false
content = "u-boot-spl.bin"
wrap = "k230-first-stage"

[[partitions]]
name = "spl-copy"
role = "bootloader"
offset = "1536K"
in_table = false
content = "u-boot-spl.bin"
wrap = "k230-first-stage"

[[partitions]]
name = "uboot"
role = "bootloader"
offset = "2M"
in_table = false
content = "u-boot.bin"
wrap = "k230-u-boot"

# The environment, copy 1: 128 KiB slot at 3 MiB; the environment is 8 KiB.
[[partitions]]
name = "uboot-env"
role = "raw"
offset = "3M"
size = "128K"
in_table = false
file = "assets/u-boot-env.bin"

# The environment, copy 2 (redundant): 128 KiB slot at 3.125 MiB.
[[partitions]]
name = "uboot-env-redund"
role = "raw"
offset = "3200K"
size = "128K"
in_table = false
file = "assets/u-boot-env-redund.bin"

# OpenSBI (fw_jump) as a plain uImage (kernel type, no K230 header), read by the
# environment's `mmc read 0x3000000 0x1c00 <count>`. 0x380000 + ~140 KB < 4 MiB.
[[partitions]]
name = "uboot-opensbi"
role = "raw"
offset = "3584K"
in_table = false
content = "fw_jump.bin"
wrap = "opensbi-uimage"

# The root filesystem: partition 1 of the table, the one U-Boot's bootcmd reads
# (ext4load mmc 1:1 /boot/Image). Its /boot holds Image and the device tree.
[[partitions]]
name = "rootfs"
role = "rootfs"
offset = "4M"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"

[[partitions]]
name = "data"
role = "data"
type = "0fc63daf-8483-4772-8e79-3d69d8477de4"
