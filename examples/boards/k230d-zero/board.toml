# BPI-CanMV-K230D-Zero (K230D, RVV 1.0) on the K230 family. The device tree
# is written for mainline 7.3.3 (assets/dts): the SD and USB nodes as the
# AI-CAM's, the board's set from the ruyisdk kernel fork's
# bananapi-canmv-k230d-zero.dts (fork commit ae4a7e6), whose display, touch,
# camera and audio nodes mainline has nothing for. Untested on board.
version = 1
extends = "../k230/family.toml"
name = "k230d-zero"
description = "BPI-CanMV-K230D-Zero (K230D)"

[target]

[kernel]
device_tree = "canaan/bananapi-canmv-k230d-zero"
device_tree_dir = "assets/dts"
fragments = ["../k230/assets/linux.fragment", "assets/linux.fragment"]

# The Zero's own U-Boot defconfig (a family may not name one).
[bootloader]
defconfig = "k230d_canmv_bpi"
