config = 3
build_name = "luckfox-pico-pro"
version = "0.1.0"
description = "Luckfox Pico Pro (RV1106G2, 128 MB SPI-NAND): vendor kernel and U-Boot, A/B slots in UBI. Written, untested on board."
target = "luckfox-pico-pro"
profile = "release"
# Atlas's device package: atlas-ubi and its boot hook for the slot environments,
# and board-lite, which identifies the board to Atlas on the LAN.
imports = [
  { source = "atlas", path = "devices/luckfox-pico-pro/gaia/device.toml" },
]

[workspace]
root_dir = "examples/boards/luckfox-pico-pro"
build_dir = "../../../.gaia/examples/luckfox-pico-pro/build"

[[workspace.named_paths]]
alias = "assets"
path = "assets"
kind = "host"

[cpu]
profile = "cortex-a7"

[providers.buildroot]
timeout_seconds = 14400

[cache]
downloads = "../../../.gaia/cache/buildroot/dl"

[cache.ccache]
enabled = true
dir = "../../../.gaia/cache/buildroot/ccache"

[[sources]]
id = "buildroot"
kind = "git"
repo = "https://gitlab.com/buildroot.org/buildroot.git"
tag = "2026.02.3"
refresh = "never"
pin = "locked"

# The Luckfox SDK: toolchain, vendor kernel, U-Boot and rkbin.
[[sources]]
id = "luckfox"
kind = "git"
repo = "https://github.com/LuckfoxTECH/luckfox-pico.git"
rev = "824b817f889c2cbff1d48fcdb18ab494a68f69d1"
refresh = "never"
pin = "locked"

[[sources]]
id = "atlas"
kind = "git"
repo = "https://github.com/Prometheus-Dynamics/Atlas-Hardware-Manager.git"
rev = "d53912e6173d4883704dbd3ae69035ac19224f92"
refresh = "never"
pin = "locked"

[image]
kind = "buildroot"
source = "buildroot"
defconfig_path = "${assets}/luckfox_pico_pro_defconfig"
external_tree_mode = "disabled"
override_srcdirs = [
  ["linux", "${source.luckfox.path}/sysdrv/source/kernel"],
]
config_overrides = [
  ["BR2_TOOLCHAIN_EXTERNAL_PATH", "\"${source.luckfox.path}/tools/linux/toolchain/arm-rockchip830-linux-uclibcgnueabihf\""],
  ["BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES", "${assets}/linux.fragment"],
  ["BR2_ROOTFS_OVERLAY", "${assets}/overlay"],
  ["BR2_ROOTFS_POST_BUILD_SCRIPT", "${assets}/post-build.sh"],
  ["BR2_ROOTFS_POST_IMAGE_SCRIPT", "${assets}/post-image.sh"],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"${source.luckfox.path} rv1106g-luckfox-pico-pro-max\""],
]

[[image.expected_images]]
name = "rootfs.erofs"
format = "erofs"
required = true

[[image.expected_images]]
name = "rkbin-LICENSE.txt"
format = "file"
required = true

[[image.expected_images]]
name = "boot.img"
format = "file"
required = true

[[image.expected_images]]
name = "uboot.img"
format = "file"
required = true

[[image.expected_images]]
name = "idblock.img"
format = "file"
required = true

[[image.expected_images]]
name = "rv1106_download_v1.15.108.bin"
format = "file"
required = true

[reporting]
summary = true
manifest = true

[outputs]
dir = "../../../.gaia/examples/luckfox-pico-pro/out"
images_dir = "${outputs.dir}/images"
report = true

[image.assembly]
work_dir = "${workspace.build_dir}/assembly"
out_dir = "${provider.images}"

# SPI-NAND layout (128 KiB blocks, 2 KiB pages), as mtdparts in the U-Boot
# environment the vendor U-Boot reads at offset 0:
#   env 256K @0 | idblock 256K @256K | uboot 512K @512K | boot 6M @1M
#   | boot_b 6M @7M | ubi (rest) @13M
# boot.img (FIT: zImage, dtb, resource) is 4.4 MiB with the SDK's kernel
# config, so the boot slots are 6M rather than the SDK's 4M.
# The UBI partition holds rootfs A/B and data. Each root is EROFS with its
# dm-verity tree appended (rootfs.verity.erofs), opened by the kernel itself:
# dm-mod.create= in the slot's command line (CONFIG_DM_INIT), on the slot's
# ubiblock, so no initramfs. The tree's root hash is in the slot environments.
# The environment holds two 128K copies. U-Boot reads the first and falls back
# to the second when the first fails its CRC, which is how a slot trial falls
# back: see "NAND slots" in ../README.md. The slot environments are published
# for the slot install; env.img is the factory image, slot A in both copies.
[[image.assembly.transforms]]
kind = "verity"
src = "${provider.images}/rootfs.erofs"
dest = "${assembly.work}/rootfs.verity.erofs"

[[image.assembly.trees]]
id = "slot-env"
path = "${assembly.work}/slot-env"

[[image.assembly.files]]
tree = "slot-env"
dest = "a.txt"
content = "mtdparts=spi-nand0:256K(env),256K@256K(idblock),512K(uboot),6M(boot),6M(boot_b),-(ubi)\nsys_bootargs=ubi.mtd=5 ubi.block=0,rootfs_a dm-mod.create=\"vroot,,,ro,0 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_sectors} verity 1 /dev/ubiblock0_0 /dev/ubiblock0_0 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_blocks} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_start_block} sha256 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:root_hash} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:salt}\" root=/dev/dm-0 rootfstype=erofs ro rootwait panic=5 gaia.slot=a\nbootcmd=if test -n \"$gaia_trial\"; then mtd erase spi-nand0 0 0x20000; fi; boot_fit; boot_android $devtype $devnum; if test -n \"$gaia_trial\"; then reset; fi\n"

[[image.assembly.files]]
tree = "slot-env"
dest = "b.txt"
content = "mtdparts=spi-nand0:256K(env),256K@256K(idblock),512K(uboot),6M(boot_a),6M(boot),-(ubi)\nsys_bootargs=ubi.mtd=5 ubi.block=0,rootfs_b dm-mod.create=\"vroot,,,ro,0 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_sectors} verity 1 /dev/ubiblock0_1 /dev/ubiblock0_1 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_blocks} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_start_block} sha256 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:root_hash} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:salt}\" root=/dev/dm-0 rootfstype=erofs ro rootwait panic=5 gaia.slot=b\nbootcmd=if test -n \"$gaia_trial\"; then mtd erase spi-nand0 0 0x20000; fi; boot_fit; boot_android $devtype $devnum; if test -n \"$gaia_trial\"; then reset; fi\n"

[[image.assembly.files]]
tree = "slot-env"
dest = "a-trial.txt"
content = "mtdparts=spi-nand0:256K(env),256K@256K(idblock),512K(uboot),6M(boot),6M(boot_b),-(ubi)\nsys_bootargs=ubi.mtd=5 ubi.block=0,rootfs_a dm-mod.create=\"vroot,,,ro,0 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_sectors} verity 1 /dev/ubiblock0_0 /dev/ubiblock0_0 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_blocks} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_start_block} sha256 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:root_hash} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:salt}\" root=/dev/dm-0 rootfstype=erofs ro rootwait panic=5 gaia.slot=a gaia.trial=1\ngaia_trial=1\nbootcmd=if test -n \"$gaia_trial\"; then mtd erase spi-nand0 0 0x20000; fi; boot_fit; boot_android $devtype $devnum; if test -n \"$gaia_trial\"; then reset; fi\n"

[[image.assembly.files]]
tree = "slot-env"
dest = "b-trial.txt"
content = "mtdparts=spi-nand0:256K(env),256K@256K(idblock),512K(uboot),6M(boot_a),6M(boot),-(ubi)\nsys_bootargs=ubi.mtd=5 ubi.block=0,rootfs_b dm-mod.create=\"vroot,,,ro,0 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_sectors} verity 1 /dev/ubiblock0_1 /dev/ubiblock0_1 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_block_size} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:data_blocks} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:hash_start_block} sha256 ${assembly.verity:${assembly.work}/rootfs.verity.erofs:root_hash} ${assembly.verity:${assembly.work}/rootfs.verity.erofs:salt}\" root=/dev/dm-0 rootfstype=erofs ro rootwait panic=5 gaia.slot=b gaia.trial=1\ngaia_trial=1\nbootcmd=if test -n \"$gaia_trial\"; then mtd erase spi-nand0 0 0x20000; fi; boot_fit; boot_android $devtype $devnum; if test -n \"$gaia_trial\"; then reset; fi\n"

[[image.assembly.transforms]]
kind = "uboot-env"
src = "${assembly.tree.slot-env}/a.txt"
dest = "${assembly.out}/env.img"
env_size = "128K"
copies = 2

[[image.assembly.transforms]]
kind = "uboot-env"
src = "${assembly.tree.slot-env}/a.txt"
dest = "${assembly.out}/env-a.img"
env_size = "128K"

[[image.assembly.transforms]]
kind = "uboot-env"
src = "${assembly.tree.slot-env}/b.txt"
dest = "${assembly.out}/env-b.img"
env_size = "128K"

[[image.assembly.transforms]]
kind = "uboot-env"
src = "${assembly.tree.slot-env}/a-trial.txt"
dest = "${assembly.out}/env-a-trial.img"
env_size = "128K"

[[image.assembly.transforms]]
kind = "uboot-env"
src = "${assembly.tree.slot-env}/b-trial.txt"
dest = "${assembly.out}/env-b-trial.img"
env_size = "128K"

[[image.assembly.ubis]]
id = "ubi"
output = "${assembly.out}/ubi.img"
peb_size = "128K"
min_io_size = "2K"
flash_size = "115M"

[[image.assembly.ubis.volumes]]
name = "rootfs_a"
image = "${assembly.work}/rootfs.verity.erofs"
size = "40M"

[[image.assembly.ubis.volumes]]
name = "rootfs_b"
size = "40M"

[[image.assembly.ubis.volumes]]
name = "data"
size = "4M"
autoresize = true

# What a slot install writes, for either slot: see "NAND slots" in ../README.md.
[[image.assembly.archives]]
id = "slot-bundle"
output = "${assembly.out}/slot-bundle.tar"

[[image.assembly.archives.members]]
name = "boot.img"
src = "${provider.images}/boot.img"

[[image.assembly.archives.members]]
name = "rootfs.erofs"
src = "${assembly.work}/rootfs.verity.erofs"

[[image.assembly.archives.members]]
name = "env-a.img"
src = "${assembly.out}/env-a.img"

[[image.assembly.archives.members]]
name = "env-b.img"
src = "${assembly.out}/env-b.img"

[[image.assembly.archives.members]]
name = "env-a-trial.img"
src = "${assembly.out}/env-a-trial.img"

[[image.assembly.archives.members]]
name = "env-b-trial.img"
src = "${assembly.out}/env-b-trial.img"
