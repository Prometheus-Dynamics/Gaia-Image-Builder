config = 3
extends = "../a733/base.toml"
build_name = "cubie-a7s"
description = "Radxa Cubie A7S (Allwinner A733): Linux 7.3.3 with the A733 series, Radxa U-Boot and TF-A from source, A/B root slots and SSH. Written, untested on board; the image holds a closed DRAM blob and must not be published (../a733/base.toml)."
target = "cubie-a7s"

[workspace]
root_dir = "examples/boards/cubie-a7s"
build_dir = "../../../.gaia/examples/cubie-a7s/build"

[image]
config_overrides = [
  ["BR2_TARGET_GENERIC_HOSTNAME", "\"cubie-a7s\""],
  ["BR2_LINUX_KERNEL_INTREE_DTS_NAME", "\"allwinner/sun60i-a733-cubie-a7s\""],
  ["BR2_TARGET_UBOOT_BOARD_DEFCONFIG", "\"radxa-cubie-a7s\""],
  ["BR2_ROOTFS_POST_SCRIPT_ARGS", "\"- allwinner/sun60i-a733-cubie-a7s ttyS0,115200\""],
]

[outputs]
dir = "../../../.gaia/examples/cubie-a7s/out"
